name = "CJPM"
grammar = "toml"
path_suffixes = [
    "cjpm.toml",
]
line_comments = ["# "]
autoclose_before = ",]}"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
]
debuggers = ["cjdb", "CodeLLDB", "GDB"]
